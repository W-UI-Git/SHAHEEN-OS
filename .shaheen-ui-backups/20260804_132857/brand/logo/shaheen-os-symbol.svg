<svg xmlns="http://www.w3.org/2000/svg"
     width="1024"
     height="1024"
     viewBox="0 0 1024 1024">

  <defs>
    <linearGradient id="gold"
                    x1="0"
                    y1="0"
                    x2="1"
                    y2="1">
      <stop offset="0%" stop-color="#F1D98A"/>
      <stop offset="45%" stop-color="#D6B45A"/>
      <stop offset="100%" stop-color="#8E712B"/>
    </linearGradient>

    <linearGradient id="metal"
                    x1="0"
                    y1="0"
                    x2="1"
                    y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#D7D9DE"/>
      <stop offset="100%" stop-color="#777B83"/>
    </linearGradient>
  </defs>

  <rect
      width="1024"
      height="1024"
      rx="220"
      fill="#050507"/>

  <!-- Outer ring -->
  <circle
      cx="512"
      cy="512"
      r="360"
      fill="none"
      stroke="#15171B"
      stroke-width="10"/>

  <circle
      cx="512"
      cy="512"
      r="330"
      fill="none"
      stroke="#D6B45A"
      stroke-opacity=".35"
      stroke-width="3"/>

  <!-- Abstract falcon / S geometry -->

  <path
      d="M700 270
         L540 350
         L365 330
         L285 395
         L455 430
         L600 405
         L515 470
         L325 515
         L420 560
         L605 525
         L520 625
         L360 700
         L515 675
         L700 530
         L600 500
         L700 430
         L600 390
         Z"
      fill="url(#gold)"/>

  <path
      d="M300 395
         L455 430
         L600 405
         L515 470
         L325 515"
      fill="none"
      stroke="url(#metal)"
      stroke-width="14"
      stroke-linecap="round"
      stroke-linejoin="round"/>

  <!-- Center point -->

  <circle
      cx="512"
      cy="512"
      r="9"
      fill="#FFFFFF"/>

</svg>
